<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>ネオン・インベーダー FEVER</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Press Start 2P', monospace;
            background-color: #020617;
            color: #ffffff;
            touch-action: manipulation;
            user-select: none;
            -webkit-user-select: none;
        }
        .arcade-border {
            border: 3px solid #06b6d4;
            box-shadow: 0 0 25px rgba(6, 182, 212, 0.4), inset 0 0 15px rgba(6, 182, 212, 0.2);
            transition: all 0.3s ease;
        }
        .fever-border {
            border: 4px solid #ec4899 !important;
            box-shadow: 0 0 45px #ec4899, inset 0 0 30px #ec4899 !important;
            animation: feverPulse 0.35s infinite alternate;
        }
        @keyframes feverPulse {
            0% { box-shadow: 0 0 20px #ec4899, inset 0 0 15px #ec4899; }
            100% { box-shadow: 0 0 50px #f43f5e, inset 0 0 35px #f43f5e; }
        }
        .crt-overlay {
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.4) 50%);
            background-size: 100% 4px;
            pointer-events: none;
        }
        .btn-arcade {
            transition: transform 0.05s ease, box-shadow 0.05s ease;
            box-shadow: 0 4px 0 #334155;
        }
        .btn-arcade:active {
            transform: translateY(3px);
            box-shadow: 0 1px 0 #334155;
        }
        .neon-text-cyan { text-shadow: 0 0 10px #06b6d4, 0 0 20px #06b6d4; }
        .neon-text-pink { text-shadow: 0 0 10px #ec4899, 0 0 25px #f43f5e; }
        .neon-text-yellow { text-shadow: 0 0 10px #eab308, 0 0 20px #eab308; }
    </style>
</head>
<body class="min-h-screen flex flex-col items-center justify-between p-2 md:p-4 bg-slate-950 overflow-x-hidden">

    <!-- ヘッダー UI（スコア / コンボ / ライフ / フィーバーゲージ） -->
    <header class="w-full max-w-lg bg-slate-900/90 border-2 border-slate-700 p-2 md:p-3 rounded-xl shadow-2xl space-y-2 text-[8px] md:text-xs">
        <div class="flex justify-between items-center">
            <div class="text-center">
                <span class="text-slate-400 block text-[7px] md:text-[8px] mb-1">SCORE</span>
                <span id="scoreText" class="text-cyan-400 font-bold tracking-wider">000000</span>
            </div>
            <div class="text-center">
                <span class="text-slate-400 block text-[7px] md:text-[8px] mb-1">COMBO</span>
                <span id="comboText" class="text-yellow-400 font-bold text-sm md:text-base neon-text-yellow">x1</span>
            </div>
            <div class="text-center">
                <span class="text-slate-400 block text-[7px] md:text-[8px] mb-1">HIGH SCORE</span>
                <span id="highScoreText" class="text-purple-400 font-bold tracking-wider">000000</span>
            </div>
            <div class="text-center">
                <span class="text-slate-400 block text-[7px] md:text-[8px] mb-1">LIVES</span>
                <span id="livesText" class="text-red-400 font-bold tracking-widest">♥♥♥</span>
            </div>
        </div>

        <!-- フィーバーゲージバー -->
        <div class="w-full bg-slate-950 rounded-full border border-slate-700 h-3.5 overflow-hidden p-0.5 relative">
            <div id="feverBar" class="h-full rounded-full bg-gradient-to-r from-cyan-500 via-purple-500 to-pink-500 transition-all duration-100 w-0"></div>
            <span id="feverLabel" class="absolute inset-0 flex items-center justify-center text-[7px] font-bold text-white tracking-widest drop-shadow">FEVER GAUGE</span>
        </div>
    </header>

    <!-- メインゲームキャンバスエリア -->
    <main class="relative w-full max-w-lg my-2 flex justify-center items-center">
        <div id="arcadeContainer" class="relative arcade-border rounded-xl overflow-hidden bg-slate-950 flex-shrink-0">
            <canvas id="gameCanvas" width="480" height="540" class="block w-full max-w-[480px] aspect-[8/9]"></canvas>
            
            <!-- CRT風走査線 -->
            <div class="absolute inset-0 crt-overlay"></div>

            <!-- フィーバー発動バナー -->
            <div id="feverBanner" class="absolute top-10 left-0 w-full text-center pointer-events-none opacity-0 transition-opacity duration-300">
                <span class="text-xl md:text-2xl text-pink-500 font-black tracking-widest neon-text-pink animate-bounce block">
                    🔥 FEVER MODE 🔥
                </span>
                <span class="text-[9px] text-yellow-300 font-bold tracking-wider">TRIPLE SPREAD LASER!</span>
            </div>

            <!-- オーバーレイ (スタート / ゲームオーバー / ポーズ) -->
            <div id="overlay" class="absolute inset-0 bg-slate-950/90 flex flex-col items-center justify-center p-4 text-center z-10 transition-all duration-300">
                <h1 id="overlayTitle" class="text-2xl md:text-3xl text-cyan-400 mb-2 neon-text-cyan tracking-wider">NEON INVADERS</h1>
                <p id="overlaySubtitle" class="text-[9px] md:text-xs text-slate-300 mb-6 leading-relaxed font-sans">
                    連続でインベーダーを撃破してコンボを稼げ！<br>
                    ゲージ満タンで<span class="text-pink-400 font-bold">HYPER FEVER MODE</span>突入！
                </p>
                <button id="startBtn" class="bg-cyan-600 hover:bg-cyan-500 text-white font-bold py-3.5 px-8 rounded-lg border-2 border-cyan-300 shadow-lg transform active:scale-95 transition text-xs tracking-wider">
                    GAME START
                </button>
                <div class="mt-6 text-[8px] text-slate-400 hidden md:block leading-normal font-sans">
                    [←][→] / [A][D]: 移動 | [SPACE] / [K]: 攻撃 | [P]: ポーズ
                </div>
            </div>
        </div>
    </main>

    <!-- サウンド・ポーズ＆スマホ用タッチコントローラー -->
    <footer class="w-full max-w-lg flex flex-col gap-2">
        <div class="flex justify-between items-center gap-2">
            <button id="btnSound" class="bg-slate-800 hover:bg-slate-700 text-slate-300 py-2 px-3 rounded-lg text-[8px] border border-slate-600 btn-arcade flex items-center gap-1">
                <span id="soundIcon">🔊</span> SOUND
            </button>
            <div class="text-[8px] text-slate-500 font-sans">WAVE: <span id="waveText" class="text-cyan-400 font-bold">1</span></div>
            <button id="btnPause" class="bg-slate-800 hover:bg-slate-700 text-slate-300 py-2 px-4 rounded-lg text-[8px] border border-slate-600 btn-arcade">
                PAUSE
            </button>
        </div>

        <!-- スマホ用コントローラー -->
        <div class="grid grid-cols-3 gap-2 md:hidden">
            <button id="btnLeft" class="bg-slate-800 active:bg-slate-700 text-slate-200 py-4 rounded-lg border border-slate-600 text-base font-bold btn-arcade select-none touch-none">
                ◄ LEFT
            </button>
            <button id="btnFire" class="bg-red-600 active:bg-red-500 text-white py-4 rounded-lg border border-red-400 text-base font-bold btn-arcade select-none touch-none">
                🔥 FIRE
            </button>
            <button id="btnRight" class="bg-slate-800 active:bg-slate-700 text-slate-200 py-4 rounded-lg border border-slate-600 text-base font-bold btn-arcade select-none touch-none">
                RIGHT ►
            </button>
        </div>
    </footer>

    <script>
        // --- Web Audio API サウンドシステム ---
        class SoundSystem {
            constructor() {
                this.ctx = null;
                this.muted = false;
            }
            init() {
                if (!this.ctx) {
                    this.ctx = new (window.AudioContext || window.webkitAudioContext)();
                }
            }
            toggleMute() {
                this.muted = !this.muted;
                return this.muted;
            }
            playTone(freq, type = 'square', duration = 0.1, gainVal = 0.1, drop = false) {
                if (this.muted || !this.ctx) return;
                try {
                    const osc = this.ctx.createOscillator();
                    const gain = this.ctx.createGain();
                    osc.type = type;
                    osc.frequency.setValueAtTime(freq, this.ctx.currentTime);
                    if (drop) {
                        osc.frequency.exponentialRampToValueAtTime(30, this.ctx.currentTime + duration);
                    }
                    gain.gain.setValueAtTime(gainVal, this.ctx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + duration);
                    osc.connect(gain);
                    gain.connect(this.ctx.destination);
                    osc.start();
                    osc.stop(this.ctx.currentTime + duration);
                } catch(e){}
            }
            playShoot() { this.playTone(880, 'square', 0.07, 0.08, true); }
            playFeverShoot() { this.playTone(1300, 'triangle', 0.05, 0.1, true); }
            playHit() { this.playTone(200, 'sawtooth', 0.1, 0.15, true); }
            playUfoHit() {
                if (this.muted || !this.ctx) return;
                const notes = [600, 800, 1000, 1200];
                notes.forEach((f, idx) => setTimeout(() => this.playTone(f, 'sine', 0.08, 0.12), idx * 40));
            }
            playPlayerHit() { this.playTone(90, 'sawtooth', 0.4, 0.25, true); }
            playCombo(count) {
                if (this.muted || !this.ctx) return;
                const baseFreq = 440 + Math.min(count, 10) * 50;
                this.playTone(baseFreq, 'sine', 0.1, 0.09);
            }
            playFeverStart() {
                if (this.muted || !this.ctx) return;
                const freqs = [440, 554, 659, 880, 1108, 1318];
                freqs.forEach((f, idx) => setTimeout(() => this.playTone(f, 'square', 0.12, 0.12), idx * 50));
            }
            playUFOSound() {
                if (this.muted || !this.ctx) return;
                this.playTone(700, 'sine', 0.08, 0.04);
            }
        }

        const sound = new SoundSystem();

        // --- キャンバス & 定数設定 ---
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const W = canvas.width;  // 480
        const H = canvas.height; // 540

        // ゲーム状態
        let gameState = 'START'; // START, PLAYING, PAUSED, GAMEOVER
        let score = 0;
        let highScore = parseInt(localStorage.getItem('invader_high_score') || '0', 10);
        let lives = 3;
        let wave = 1;

        // コンボ & フィーバー変数
        let comboCount = 0;
        let comboMultiplier = 1;
        let feverGauge = 0; // 0 to 100
        let isFeverMode = false;
        let feverTimer = 0;
        const FEVER_MAX_TIME = 7.5; // 7.5秒間

        // プレイヤー
        const player = {
            x: W / 2 - 16,
            y: H - 45,
            w: 32,
            h: 18,
            speed: 6.0,
            lastShotTime: 0,
            invulnerableTimer: 0
        };

        // UFO（ボーナス敵）
        let ufo = null;
        let ufoTimer = 0;

        // 配列管理
        let playerBullets = [];
        let invaderBullets = [];
        let invaders = [];
        let shelters = [];
        let particles = [];
        let floatingTexts = [];
        let stars = [];

        // インベーダー群の移動状態
        let invaderDir = 1;
        let invaderStepTimer = 0;
        let invaderStepInterval = 600; // ms

        // キー入力状態
        const keys = { Left: false, Right: false, Fire: false };

        // --- 背景の星の初期化 ---
        function initStars() {
            stars = [];
            for (let i = 0; i < 40; i++) {
                stars.push({
                    x: Math.random() * W,
                    y: Math.random() * H,
                    size: Math.random() * 2 + 0.5,
                    speed: Math.random() * 0.8 + 0.2,
                    alpha: Math.random() * 0.8 + 0.2
                });
            }
        }

        // --- インベーダー初期化 ---
        function createInvaders() {
            invaders = [];
            const rows = 5;
            const cols = 8;
            const startX = 45;
            const startY = 65;
            const paddingX = 42;
            const paddingY = 30;

            for (let r = 0; r < rows; r++) {
                for (let c = 0; c < cols; c++) {
                    let type = 'C';
                    let pts = 10;
                    let color = '#06b6d4'; // シアン

                    if (r === 0) {
                        type = 'A';
                        pts = 30;
                        color = '#f43f5e'; // ピンク
                    } else if (r === 1 || r === 2) {
                        type = 'B';
                        pts = 20;
                        color = '#a855f7'; // パープル
                    }

                    invaders.push({
                        x: startX + c * paddingX,
                        y: startY + r * paddingY,
                        w: 26,
                        h: 20,
                        type: type,
                        pts: pts,
                        color: color,
                        frame: 0
                    });
                }
            }
            // ウェーブが進むごとに基本速度向上
            invaderStepInterval = Math.max(100, 550 - (wave - 1) * 70);
        }

        // --- トーチカ（シェルター）初期化 ---
        function createShelters() {
            shelters = [];
            const count = 3;
            const width = 54;
            const height = 30;
            const gap = (W - (count * width)) / (count + 1);

            for (let i = 0; i < count; i++) {
                const sx = gap + i * (width + gap);
                const sy = H - 110;
                
                const rows = 4;
                const cols = 6;
                const bw = width / cols;
                const bh = height / rows;

                for (let r = 0; r < rows; r++) {
                    for (let c = 0; c < cols; c++) {
                        if (r >= 2 && (c === 2 || c === 3)) continue; // アーチ抜き
                        shelters.push({
                            x: sx + c * bw,
                            y: sy + r * bh,
                            w: bw,
                            h: bh,
                            hp: 3
                        });
                    }
                }
            }
        }

        // --- 画面シェイク＆エフェクト ---
        let shakeTime = 0;
        function triggerScreenShake(duration = 10) {
            shakeTime = duration;
        }

        function createExplosion(x, y, color, count = 12) {
            for (let i = 0; i < count; i++) {
                const angle = Math.random() * Math.PI * 2;
                const speed = 1 + Math.random() * 4.5;
                particles.push({
                    x: x,
                    y: y,
                    vx: Math.cos(angle) * speed,
                    vy: Math.sin(angle) * speed,
                    size: 2 + Math.random() * 3,
                    color: color,
                    alpha: 1,
                    decay: 0.025 + Math.random() * 0.025
                });
            }
        }

        function addFloatingText(text, x, y, color = '#fef08a') {
            floatingTexts.push({
                text: text,
                x: x,
                y: y,
                color: color,
                alpha: 1,
                vy: -1.2
            });
        }

        // --- プレイヤーショット ---
        function shootPlayerBullet() {
            const now = performance.now();
            const cooldown = isFeverMode ? 85 : 240;

            if (now - player.lastShotTime < cooldown) return;
            player.lastShotTime = now;

            if (isFeverMode) {
                sound.playFeverShoot();
                // 3方向ショット
                playerBullets.push({ x: player.x + player.w / 2 - 2, y: player.y, vx: 0, vy: -9.5, color: '#ec4899' });
                playerBullets.push({ x: player.x + player.w / 2 - 2, y: player.y, vx: -2.4, vy: -9.0, color: '#ec4899' });
                playerBullets.push({ x: player.x + player.w / 2 - 2, y: player.y, vx: 2.4, vy: -9.0, color: '#ec4899' });
            } else {
                if (playerBullets.length >= 2) return;
                sound.playShoot();
                playerBullets.push({ x: player.x + player.w / 2 - 2, y: player.y, vx: 0, vy: -7.5, color: '#38bdf8' });
            }
        }

        // --- フィーバー制御 ---
        function activateFever() {
            isFeverMode = true;
            feverTimer = FEVER_MAX_TIME;
            feverGauge = 100;
            sound.playFeverStart();
            triggerScreenShake(22);

            document.getElementById('arcadeContainer').classList.add('fever-border');
            document.getElementById('feverBanner').classList.remove('opacity-0');

            addFloatingText('🔥 HYPER FEVER MODE! 🔥', W / 2 - 100, H / 2, '#ec4899');
        }

        function deactivateFever() {
            isFeverMode = false;
            feverGauge = 0;
            document.getElementById('arcadeContainer').classList.remove('fever-border');
            document.getElementById('feverBanner').classList.add('opacity-0');
            updateUI();
        }

        // --- ゲームループ & 更新 ---
        let lastTime = 0;
        function update(time = 0) {
            const dt = Math.min((time - lastTime) / 1000, 0.1);
            lastTime = time;

            if (gameState === 'PLAYING') {
                // 星の移動
                stars.forEach(s => {
                    s.y += s.speed;
                    if (s.y > H) s.y = 0;
                });

                // フィーバータイマー
                if (isFeverMode) {
                    feverTimer -= dt;
                    feverGauge = Math.max(0, (feverTimer / FEVER_MAX_TIME) * 100);
                    if (feverTimer <= 0) deactivateFever();
                }

                // プレイヤー移動
                if (keys.Left) player.x -= player.speed;
                if (keys.Right) player.x += player.speed;
                player.x = Math.max(10, Math.min(W - player.w - 10, player.x));

                if (keys.Fire) shootPlayerBullet();

                if (player.invulnerableTimer > 0) player.invulnerableTimer -= dt;

                // --- UFOのスポーンと移動 ---
                ufoTimer += dt;
                if (!ufo && ufoTimer > 12) { // 12秒ごとに確率で出現
                    if (Math.random() < 0.6) {
                        const dir = Math.random() < 0.5 ? 1 : -1;
                        ufo = {
                            x: dir === 1 ? -30 : W + 30,
                            y: 35,
                            w: 32,
                            h: 16,
                            speed: dir * 2.2,
                            pts: 150
                        };
                    }
                    ufoTimer = 0;
                }

                if (ufo) {
                    ufo.x += ufo.speed;
                    if (Math.random() < 0.05) sound.playUFOSound();
                    if ((ufo.speed > 0 && ufo.x > W + 40) || (ufo.speed < 0 && ufo.x < -40)) {
                        ufo = null;
                    }
                }

                // --- プレイヤー弾更新 ---
                for (let i = playerBullets.length - 1; i >= 0; i--) {
                    const b = playerBullets[i];
                    b.x += b.vx;
                    b.y += b.vy;

                    // 画面外
                    if (b.y < 0 || b.x < 0 || b.x > W) {
                        playerBullets.splice(i, 1);
                        if (!isFeverMode) {
                            comboCount = 0;
                            comboMultiplier = 1;
                            updateUI();
                        }
                        continue;
                    }

                    // 弾 vs UFO
                    if (ufo && b.x > ufo.x && b.x < ufo.x + ufo.w && b.y > ufo.y && b.y < ufo.y + ufo.h) {
                        sound.playUfoHit();
                        createExplosion(ufo.x + ufo.w / 2, ufo.y + ufo.h / 2, '#ef4444', 18);
                        triggerScreenShake(10);
                        score += ufo.pts * comboMultiplier;
                        addFloatingText(`UFO +${ufo.pts * comboMultiplier}!`, ufo.x, ufo.y, '#f43f5e');
                        ufo = null;
                        playerBullets.splice(i, 1);

                        if (!isFeverMode) {
                            feverGauge = Math.min(100, feverGauge + 35);
                            if (feverGauge >= 100) activateFever();
                        }
                        updateUI();
                        continue;
                    }

                    // 弾 vs インベーダー
                    let hit = false;
                    for (let j = invaders.length - 1; j >= 0; j--) {
                        const inv = invaders[j];
                        if (b.x > inv.x && b.x < inv.x + inv.w && b.y > inv.y && b.y < inv.y + inv.h) {
                            sound.playHit();
                            createExplosion(inv.x + inv.w / 2, inv.y + inv.h / 2, inv.color);
                            triggerScreenShake(5);

                            comboCount++;
                            comboMultiplier = Math.min(10, 1 + Math.floor(comboCount / 2));
                            sound.playCombo(comboCount);

                            const feverBonus = isFeverMode ? 2 : 1;
                            const ptsGained = inv.pts * comboMultiplier * feverBonus;
                            score += ptsGained;

                            addFloatingText(`+${ptsGained}${comboMultiplier > 1 ? ` (x${comboMultiplier})` : ''}`, inv.x, inv.y, inv.color);

                            if (!isFeverMode) {
                                feverGauge = Math.min(100, feverGauge + 7);
                                if (feverGauge >= 100) activateFever();
                            }

                            invaders.splice(j, 1);
                            playerBullets.splice(i, 1);
                            hit = true;

                            if (score > highScore) {
                                highScore = score;
                                localStorage.setItem('invader_high_score', highScore.toString());
                            }
                            updateUI();
                            break;
                        }
                    }

                    if (hit) continue;

                    // 弾 vs シェルター
                    for (let k = shelters.length - 1; k >= 0; k--) {
                        const sh = shelters[k];
                        if (b.x > sh.x && b.x < sh.x + sh.w && b.y > sh.y && b.y < sh.y + sh.h) {
                            sh.hp--;
                            if (sh.hp <= 0) shelters.splice(k, 1);
                            createExplosion(b.x, b.y, '#94a3b8', 4);
                            playerBullets.splice(i, 1);
                            break;
                        }
                    }
                }

                // --- インベーダー移動（残数が減ると加速） ---
                const remainingRatio = invaders.length / 40;
                const dynamicInterval = (isFeverMode ? invaderStepInterval * 1.1 : invaderStepInterval) * Math.max(0.2, remainingRatio);

                invaderStepTimer += dt * 1000;
                if (invaderStepTimer >= dynamicInterval) {
                    invaderStepTimer = 0;

                    let reachEdge = false;
                    for (let inv of invaders) {
                        inv.frame = inv.frame === 0 ? 1 : 0;
                        if ((invaderDir === 1 && inv.x + inv.w >= W - 12) || (invaderDir === -1 && inv.x <= 12)) {
                            reachEdge = true;
                        }
                    }

                    if (reachEdge) {
                        invaderDir *= -1;
                        for (let inv of invaders) {
                            inv.y += 12;
                            if (inv.y + inv.h >= player.y) triggerGameOver();
                        }
                    } else {
                        for (let inv of invaders) {
                            inv.x += invaderDir * 7;
                        }
                    }

                    // 敵の攻撃
                    if (invaders.length > 0 && Math.random() < 0.35 + wave * 0.05) {
                        const shooter = invaders[Math.floor(Math.random() * invaders.length)];
                        invaderBullets.push({
                            x: shooter.x + shooter.w / 2,
                            y: shooter.y + shooter.h,
                            vy: 3.6 + wave * 0.35
                        });
                    }
                }

                // --- 敵弾更新 ---
                for (let i = invaderBullets.length - 1; i >= 0; i--) {
                    const eb = invaderBullets[i];
                    eb.y += eb.vy;

                    if (eb.y > H) {
                        invaderBullets.splice(i, 1);
                        continue;
                    }

                    // 敵弾 vs シェルター
                    let hitShelter = false;
                    for (let k = shelters.length - 1; k >= 0; k--) {
                        const sh = shelters[k];
                        if (eb.x > sh.x && eb.x < sh.x + sh.w && eb.y > sh.y && eb.y < sh.y + sh.h) {
                            sh.hp--;
                            if (sh.hp <= 0) shelters.splice(k, 1);
                            createExplosion(eb.x, eb.y, '#94a3b8', 4);
                            invaderBullets.splice(i, 1);
                            hitShelter = true;
                            break;
                        }
                    }
                    if (hitShelter) continue;

                    // 敵弾 vs プレイヤー
                    if (eb.x > player.x && eb.x < player.x + player.w && eb.y > player.y && eb.y < player.y + player.h) {
                        invaderBullets.splice(i, 1);

                        if (isFeverMode) {
                            // フィーバー中はガード
                            sound.playHit();
                            createExplosion(eb.x, eb.y, '#ec4899', 8);
                            addFloatingText('REFLECT!', eb.x, eb.y - 12, '#ec4899');
                        } else if (player.invulnerableTimer <= 0) {
                            lives--;
                            comboCount = 0;
                            comboMultiplier = 1;
                            sound.playPlayerHit();
                            createExplosion(player.x + player.w / 2, player.y + player.h / 2, '#ef4444', 22);
                            triggerScreenShake(18);
                            player.invulnerableTimer = 2.0;
                            updateUI();

                            if (lives <= 0) triggerGameOver();
                        }
                    }
                }

                // 次のウェーブ
                if (invaders.length === 0) {
                    wave++;
                    addFloatingText(`WAVE ${wave} CLEAR!`, W / 2 - 60, H / 2, '#38bdf8');
                    createInvaders();
                    createShelters();
                    updateUI();
                }

                // エフェクト更新
                particles.forEach((p, idx) => {
                    p.x += p.vx;
                    p.y += p.vy;
                    p.alpha -= p.decay;
                    if (p.alpha <= 0) particles.splice(idx, 1);
                });

                floatingTexts.forEach((ft, idx) => {
                    ft.y += ft.vy;
                    ft.alpha -= 0.02;
                    if (ft.alpha <= 0) floatingTexts.splice(idx, 1);
                });
            }

            draw();
            requestAnimationFrame(update);
        }

        // --- 描画処理 ---
        function draw() {
            ctx.save();

            if (shakeTime > 0) {
                const rx = (Math.random() - 0.5) * shakeTime;
                const ry = (Math.random() - 0.5) * shakeTime;
                ctx.translate(rx, ry);
                shakeTime--;
            }

            // 背景描画
            ctx.fillStyle = isFeverMode ? '#1e0924' : '#030712';
            ctx.fillRect(0, 0, W, H);

            // 背景の星
            stars.forEach(s => {
                ctx.fillStyle = `rgba(255, 255, 255, ${s.alpha})`;
                ctx.fillRect(s.x, s.y, s.size, s.size);
            });

            // 背景グリッド
            ctx.strokeStyle = isFeverMode ? 'rgba(236, 72, 153, 0.08)' : 'rgba(6, 182, 212, 0.04)';
            ctx.lineWidth = 1;
            for (let x = 0; x < W; x += 30) {
                ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, H); ctx.stroke();
            }

            // シェルター描画
            shelters.forEach(sh => {
                ctx.fillStyle = sh.hp === 3 ? '#22c55e' : sh.hp === 2 ? '#eab308' : '#ef4444';
                ctx.fillRect(sh.x, sh.y, sh.w - 0.5, sh.h - 0.5);
            });

            // UFO描画
            if (ufo) {
                ctx.fillStyle = '#ef4444';
                ctx.fillRect(ufo.x + 4, ufo.y + 4, ufo.w - 8, ufo.h - 8);
                ctx.fillRect(ufo.x + 8, ufo.y, ufo.w - 16, 4);
                ctx.fillStyle = '#fef08a';
                ctx.fillRect(ufo.x + 6, ufo.y + 6, 4, 4);
                ctx.fillRect(ufo.x + 22, ufo.y + 6, 4, 4);
            }

            // インベーダー描画
            invaders.forEach(inv => {
                ctx.fillStyle = inv.color;
                ctx.fillRect(inv.x + 4, inv.y + 4, inv.w - 8, inv.h - 6);
                ctx.fillRect(inv.x + (inv.frame === 0 ? 2 : 0), inv.y + 2, 4, 4);
                ctx.fillRect(inv.x + inv.w - (inv.frame === 0 ? 6 : 4), inv.y + 2, 4, 4);
                ctx.fillRect(inv.x + 6, inv.y + inv.h - 4, 4, 4);
                ctx.fillRect(inv.x + inv.w - 10, inv.y + inv.h - 4, 4, 4);
            });

            // プレイヤー描画（無敵時点滅）
            if (player.invulnerableTimer <= 0 || Math.floor(performance.now() / 80) % 2 === 0) {
                ctx.fillStyle = isFeverMode ? '#ec4899' : '#38bdf8';
                ctx.fillRect(player.x, player.y + 8, player.w, player.h - 8);
                ctx.fillRect(player.x + player.w / 2 - 4, player.y, 8, 8);
                ctx.fillRect(player.x + 2, player.y + 4, player.w - 4, 4);
            }

            // 弾描画
            playerBullets.forEach(b => {
                ctx.fillStyle = b.color;
                ctx.shadowColor = b.color;
                ctx.shadowBlur = 8;
                ctx.fillRect(b.x, b.y, 4, 10);
                ctx.shadowBlur = 0;
            });

            ctx.fillStyle = '#f43f5e';
            invaderBullets.forEach(eb => {
                ctx.fillRect(eb.x - 1.5, eb.y, 3, 8);
            });

            // パーティクル描画
            particles.forEach(p => {
                ctx.fillStyle = p.color;
                ctx.globalAlpha = p.alpha;
                ctx.fillRect(p.x, p.y, p.size, p.size);
            });
            ctx.globalAlpha = 1.0;

            // フローティングテキスト
            floatingTexts.forEach(ft => {
                ctx.font = '10px "Press Start 2P"';
                ctx.fillStyle = ft.color;
                ctx.globalAlpha = Math.max(0, ft.alpha);
                ctx.fillText(ft.text, ft.x, ft.y);
            });
            ctx.globalAlpha = 1.0;

            ctx.restore();
        }

        // --- UI & スコア更新 ---
        function updateUI() {
            document.getElementById('scoreText').innerText = String(score).padStart(6, '0');
            document.getElementById('highScoreText').innerText = String(highScore).padStart(6, '0');
            document.getElementById('comboText').innerText = `x${comboMultiplier}`;
            document.getElementById('livesText').innerText = '♥'.repeat(Math.max(0, lives));
            document.getElementById('waveText').innerText = wave;

            const feverBar = document.getElementById('feverBar');
            feverBar.style.width = `${feverGauge}%`;
        }

        // --- ゲーム状態管理 ---
        function resetGame() {
            score = 0;
            lives = 3;
            wave = 1;
            comboCount = 0;
            comboMultiplier = 1;
            feverGauge = 0;
            ufo = null;
            ufoTimer = 0;
            deactivateFever();
            playerBullets = [];
            invaderBullets = [];
            particles = [];
            floatingTexts = [];
            player.x = W / 2 - 16;
            player.invulnerableTimer = 0;
            initStars();
            createInvaders();
            createShelters();
            updateUI();
        }

        function startGame() {
            sound.init();
            resetGame();
            gameState = 'PLAYING';
            document.getElementById('overlay').classList.add('opacity-0', 'pointer-events-none');
        }

        function triggerGameOver() {
            gameState = 'GAMEOVER';
            deactivateFever();
            sound.playPlayerHit();

            const overlay = document.getElementById('overlay');
            const title = document.getElementById('overlayTitle');
            const subtitle = document.getElementById('overlaySubtitle');
            const btn = document.getElementById('startBtn');

            overlay.classList.remove('opacity-0', 'pointer-events-none');
            title.innerText = 'GAME OVER';
            title.className = 'text-2xl md:text-3xl text-red-500 mb-2 neon-text-pink tracking-wider';
            subtitle.innerText = `最終スコア: ${score}\n到達ウェーブ: ${wave}`;
            btn.innerText = 'RETRY';
        }

        function togglePause() {
            if (gameState === 'PLAYING') {
                gameState = 'PAUSED';
                const overlay = document.getElementById('overlay');
                document.getElementById('overlayTitle').innerText = 'PAUSED';
                document.getElementById('overlayTitle').className = 'text-2xl md:text-3xl text-yellow-400 mb-2 neon-text-yellow tracking-wider';
                document.getElementById('overlaySubtitle').innerText = '一時停止中';
                document.getElementById('startBtn').innerText = 'RESUME';
                overlay.classList.remove('opacity-0', 'pointer-events-none');
            } else if (gameState === 'PAUSED') {
                gameState = 'PLAYING';
                document.getElementById('overlay').classList.add('opacity-0', 'pointer-events-none');
            }
        }

        // --- イベントリスナー ---
        document.getElementById('startBtn').addEventListener('click', (e) => {
            if (e && e.target) e.target.blur(); // フォーカスを解除してSpaceキー等での誤発火を防止
            if (gameState === 'PAUSED') togglePause();
            else startGame();
        });

        document.getElementById('btnPause').addEventListener('click', (e) => {
            if (e && e.target) e.target.blur();
            togglePause();
        });

        document.getElementById('btnSound').addEventListener('click', (e) => {
            if (e && e.target) e.target.blur();
            const isMuted = sound.toggleMute();
            document.getElementById('soundIcon').innerText = isMuted ? '🔇' : '🔊';
        });

        // キーボードコントロール
        window.addEventListener('keydown', (e) => {
            if (e.code === 'KeyP') {
                e.preventDefault();
                togglePause();
            }
            if (gameState !== 'PLAYING') return;

            if (e.code === 'ArrowLeft' || e.code === 'KeyA') {
                e.preventDefault();
                keys.Left = true;
            }
            if (e.code === 'ArrowRight' || e.code === 'KeyD') {
                e.preventDefault();
                keys.Right = true;
            }
            if (e.code === 'Space' || e.code === 'KeyK') {
                e.preventDefault(); // フォーカス要素の誤クリックや画面スクロールを防止
                keys.Fire = true;
            }
        });

        window.addEventListener('keyup', (e) => {
            if (e.code === 'ArrowLeft' || e.code === 'KeyA') keys.Left = false;
            if (e.code === 'ArrowRight' || e.code === 'KeyD') keys.Right = false;
            if (e.code === 'Space' || e.code === 'KeyK') keys.Fire = false;
        });

        // タッチ操作割当
        const bindTouch = (id, keyName) => {
            const el = document.getElementById(id);
            if (!el) return;
            const start = (e) => { e.preventDefault(); sound.init(); keys[keyName] = true; };
            const end = (e) => { e.preventDefault(); keys[keyName] = false; };
            el.addEventListener('touchstart', start, { passive: false });
            el.addEventListener('touchend', end, { passive: false });
            el.addEventListener('mousedown', start);
            el.addEventListener('mouseup', end);
        };

        bindTouch('btnLeft', 'Left');
        bindTouch('btnRight', 'Right');
        bindTouch('btnFire', 'Fire');

        // 起動時
        window.onload = () => {
            initStars();
            updateUI();
            requestAnimationFrame(update);
        };
    </script>
</body>
</html>
